# Opens and updates a release PR from the Conventional Commits on main. Merging
# it tags vX.Y.Z, publishes a GitHub release, writes CHANGELOG.md and raises
# "version" in both .claude-plugin manifests. Claude Code stores an installed
# plugin under that version, so a change reaches plugin users only through a
# release.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
